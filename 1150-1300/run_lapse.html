<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الجنرال للألعاب الإلكترونية - PS4 Lapse</title>
<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background-color: #000000;
    background-image: url('image_3.png');
    background-repeat: no-repeat;
    background-position: center center;
    background-attachment: fixed;
    background-size: cover;
    color: #e6ebf2;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
  }

  /* شريط الحقوق العلوي العائم مطابق للصفحة الرئيسية */
  #brand {
    text-align: center;
    padding: 12px 16px;
    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    position: relative;
    z-index: 2;
  }

  #brand b {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: #ffffff;
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
  }

  #wrap {
    padding: 16px 18px;
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  #state {
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 12px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
  }

  /* نافذة السجل الشفافة والمدرعة بزجاج مضبب */
  #out {
    white-space: pre-wrap;
    font: 13px/1.5 Consolas, "Courier New", monospace;
    background: rgba(10, 12, 16, 0.65);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 10px;
    padding: 14px 16px;
    flex: 1;
    height: calc(100vh - 120px);
    overflow-y: auto;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
    color: #d1d5db;
  }

  /* ألوان نصوص الحالة */
  .ok { color: #52e595; }
  .bad { color: #ff6b6b; }
  .warn { color: #fca311; text-shadow: 0 0 8px rgba(252, 163, 17, 0.4); }
</style>
</head>
<body>

<!-- الشريط العلوي من دون شعار -->
<div id="brand">
  <b>الجنرال للألعاب الإلكترونية: 0918846443</b>
</div>

<div id="wrap">
  <div id="state" class="warn">loading lapse chain...</div>
  <div id="out"></div>
</div>

<script type="module" src="./chain_lapse.js"></script>
<audio id="bg-music" loop autoplay preload="auto">
  <source src="song.mp3" type="audio/mpeg">
</audio>

<script>
  var music = document.getElementById("bg-music");
  music.play().catch(function() {
    window.addEventListener("click", function() { music.play(); }, { once: true });
    window.addEventListener("keydown", function() { music.play(); }, { once: true });
  });
</script>

</body>
</html>
