<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الجنرال للألعاب الإلكترونية - PS4 Jailbreak</title>
<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background-color: #000000;
    background-image: url('image_3.png');
    background-repeat: no-repeat;
    background-position: center center;
    background-attachment: fixed;
    background-size: cover;
    color: #e6ebf2;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* شريط الحقوق العلوي العائم */
  #brand {
    text-align: center;
    padding: 12px 16px;
    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
  }

  #brand b {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: #ffffff;
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
  }

  /* الحاوية الرئيسية شفافة وأنيقة في المنتصف */
  #wrap {
    margin: auto;
    width: 90%;
    max-width: 480px;
    padding: 24px;
    background: rgba(10, 12, 16, 0.55);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 12px;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
    text-align: center;
  }

  #state {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 12px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  #det {
    font-size: 13px;
    color: #9aa5b5;
    line-height: 1.6;
    margin-bottom: 12px;
    padding: 10px;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.05);
  }

  #det b {
    color: #ffffff;
    font-weight: 600;
  }

  #cache {
    font-size: 12px;
    color: #6c788a;
    min-height: 16px;
    font-weight: 500;
  }

  /* ألوان الحالات */
  #cache.cacheok { color: #52e595; text-shadow: 0 0 8px rgba(82, 229, 149, 0.4); }
  .ok { color: #52e595; }
  .bad { color: #ff6b6b; text-shadow: 0 0 8px rgba(255, 107, 107, 0.4); }
  .warn { color: #fca311; text-shadow: 0 0 8px rgba(252, 163, 17, 0.4); }
</style>
</head>
<body>

<!-- الشريط العلوي تم حذف الشعار منه -->
<div id="brand">
  <b>الجنرال للألعاب الإلكترونية: 0918846443</b>
</div>

<!-- المحتوى الرئيسي -->
<div id="wrap">
  <div id="state">detecting firmware...</div>
  <div id="det"></div>
  <div id="cache"></div>
</div>

<script>
// البرمجة الخاصة بالجيلبريك لم تتغير إطلاقاً لضمان عمل الجيلبريك بنفس الكفاءة
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var minor = parseInt(m[2], 16);
        var ms = minor.toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }
    var bug = null, why = "";
    var forced = params.get("bug");
    if (forced === "lapse" || forced === "poops") {
        bug = forced; why = "forced via ?bug=" + forced;
    } else if (!key) {
        why = "user-agent is not a PlayStation 4";
    } else if (fwnum <= 1202) {
        bug = "lapse"; why = key + " <= 12.02";
    } else if (fwnum >= 1250) {
        bug = "poops"; why = key + " <= 12.50";
    } else {
        why = key + " -- no working bug (lapse ends at 12.02, poops needs 12.50)";
    }
    detEl.innerHTML = "firmware <b>" + (key || "unknown") + "</b>"
        + " &middot; bug <b>" + (bug || "none") + "</b><br>" + why;

    if (!bug) { setState("UNSUPPORTED FIRMWARE", "bad"); return; }

    var target = (bug === "lapse" ? "run_lapse.html" : "run_poops.html")
        + location.search;
    function go() { setState("loading " + bug + " chain...", "warn");
                    location.replace(target); }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("offline -- from cache", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("cached", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("update downloaded", true);
        waitForTap("UPDATE READY -- press X or tap to reload & run",
                   function () { location.reload(); });
    } else {
        setCache("checking cache...");
        ac.addEventListener("downloading",
            function () { setCache("caching for offline (first run)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);

        ac.addEventListener("cached", function () {
            setCache("cached for offline use", true);
            waitForTap("CACHED (first run) -- press X or tap to run", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("update downloaded", true);
            waitForTap("UPDATE READY -- press X or tap to reload & run",
                       function () { location.reload(); });
        }, false);

        ac.addEventListener("noupdate", function () {
            setCache("cached -- offline ready", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("cache unavailable");
            waitForTap("CACHE FAILED -- press X or tap to run anyway", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("cache obsolete");
            waitForTap("CACHE OBSOLETE -- press X or tap to run", go);
        }, false);
    }
})();
</script>
<!-- مشغل الصوت مع إمكانية التكرار -->
<audio id="bg-music" loop preload="auto">
  <source src="song.mp3" type="audio/mpeg">
</audio>

<script>
(function() {
  var music = document.getElementById("bg-music");

  function playAudio() {
    music.play().then(function() {
      // تم التشغيل بنجاح
    }).catch(function() {
      // في حال حظر المتصفح للتشغيل التلقائي الصامت، يتم التشغيل عند أول حركة ليد التحكم
    });
  }

  // محاولة التشغيل الفوري
  playAudio();

  // تشغيل الصوت فوراً عند أي حركة أو ضغطة زر على PS4 (زر X، أسهم، أو لمس)
  var events = ["click", "keydown", "pointerdown", "touchstart"];
  function unlockAudio() {
    playAudio();
    events.forEach(function(e) {
      window.removeEventListener(e, unlockAudio);
    });
  }

  events.forEach(function(e) {
    window.addEventListener(e, unlockAudio, { once: true });
  });
})();
</script>

</body>
</html>
